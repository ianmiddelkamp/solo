version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: invoice_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0"
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_ENV: development
      RACK_ENV: development
      REDIS_URL: redis://redis:6379/0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: invoice_dev
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SOW_PROVIDER: ${SOW_PROVIDER:-}
      SOW_API_KEY: ${SOW_API_KEY:-}
      AR_ENCRYPTION_PRIMARY_KEY: ${AR_ENCRYPTION_PRIMARY_KEY}
      AR_ENCRYPTION_DETERMINISTIC_KEY: ${AR_ENCRYPTION_DETERMINISTIC_KEY}
      AR_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_ENCRYPTION_KEY_DERIVATION_SALT}

  sidekiq:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
      - redis
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_ENV: development
      RACK_ENV: development
      REDIS_URL: redis://redis:6379/0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: invoice_dev
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SOW_PROVIDER: ${SOW_PROVIDER:-anthropic}
      SOW_API_KEY: ${SOW_API_KEY:-}
      AR_ENCRYPTION_PRIMARY_KEY: ${AR_ENCRYPTION_PRIMARY_KEY}
      AR_ENCRYPTION_DETERMINISTIC_KEY: ${AR_ENCRYPTION_DETERMINISTIC_KEY}
      AR_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_ENCRYPTION_KEY_DERIVATION_SALT}

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install --ignore-scripts && npm run start"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  db_data:
  frontend_node_modules:
