# Standalone production compose file — deliberately NOT layered on top of docker-compose.yml
# (the dev file). They used to be run together (`-f docker-compose.yml -f docker-compose.prod.yml`),
# but Compose merges same-named services across files additively for keys like `ports:`,
# `volumes:`, and `build.args` rather than replacing them — which silently leaked dev-only
# settings into "production" (Postgres published to the public internet on 5432, the Rails app
# published on 3000, the live host source tree bind-mounted over the built image instead of what
# was actually baked in, dev gems installed via BUNDLE_WITHOUT="", and the dev startup command
# bypassing the real Dockerfile's Thruster-based CMD entirely). A standalone file makes that whole
# class of bug structurally impossible instead of something to keep patching leak-by-leak.
#
# Run with: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  # Self-hosted Postgres, replacing Supabase. Postgres 17 to match Supabase's version for
  # pg_dump/restore compatibility. No `ports:` — reachable only from other containers on this
  # compose network, never from the internet.
  db_prod:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - db_prod_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs Sidekiq's queue and the app's own REDIS constant. No `ports:` — internal only.
  redis_prod:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    image: invoice_app:latest
    restart: unless-stopped
    # Bound to loopback only, not 0.0.0.0 — until Caddy is set up in front of this with TLS,
    # this stays reachable only via an SSH tunnel (ssh -L 3000:localhost:3000 ...), never
    # directly from the internet. Once Caddy exists, this mapping goes away entirely and Caddy
    # reaches this container over the internal compose network instead (web:80).
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - storage_prod:/rails/storage
    depends_on:
      db_prod:
        condition: service_healthy
      redis_prod:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DB_HOST: db_prod
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      REDIS_URL: redis://redis_prod:6379/0
      FRONTEND_HOST: ${FRONTEND_HOST}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      AR_ENCRYPTION_PRIMARY_KEY: ${AR_ENCRYPTION_PRIMARY_KEY}
      AR_ENCRYPTION_DETERMINISTIC_KEY: ${AR_ENCRYPTION_DETERMINISTIC_KEY}
      AR_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_ENCRYPTION_KEY_DERIVATION_SALT}
      SOW_PROVIDER: ${SOW_PROVIDER:-}
      SOW_API_KEY: ${SOW_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  # Reuses the same image built for `web` (no separate build block) — just overrides the command,
  # matching the pattern in the Dockerfile comment about running accessory processes off one image.
  sidekiq:
    image: invoice_app:latest
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - storage_prod:/rails/storage
    depends_on:
      db_prod:
        condition: service_healthy
      redis_prod:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DB_HOST: db_prod
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      REDIS_URL: redis://redis_prod:6379/0
      FRONTEND_HOST: ${FRONTEND_HOST}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      AR_ENCRYPTION_PRIMARY_KEY: ${AR_ENCRYPTION_PRIMARY_KEY}
      AR_ENCRYPTION_DETERMINISTIC_KEY: ${AR_ENCRYPTION_DETERMINISTIC_KEY}
      AR_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_ENCRYPTION_KEY_DERIVATION_SALT}
      SOW_PROVIDER: ${SOW_PROVIDER:-}
      SOW_API_KEY: ${SOW_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  storage_prod:
  db_prod_data:
  redis_prod_data:
