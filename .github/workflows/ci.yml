name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/invoice_app_test
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (fails on TypeScript errors)
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

  # Runs only on a push to main (not PRs) that's already passed tests/security scans/frontend
  # build. SSHes into the VPS and runs the same steps documented as the manual deploy process
  # in README.md's "Run Production" section. Deliberately does NOT depend on `lint` — style
  # issues shouldn't block a real deploy the way a failing test or security scan should.
  #
  # Migrations are run as an explicit, separate step (`db:migrate` before the container swap)
  # rather than relying solely on the Dockerfile entrypoint's implicit `db:prepare` on `web`
  # boot. That implicit path has two real gaps: `docker compose up -d` returns as soon as the
  # container starts, without waiting to see if it stays up — a failed migration would crash-loop
  # the container while this step (and the whole Actions run) still reports success. And Sidekiq's
  # entrypoint never runs migrations at all, so it could start processing jobs against a
  # not-yet-migrated schema if migration only happened implicitly on web's boot. Running migrate
  # explicitly, before anything is swapped, fails loudly (`set -e`) if something's wrong.
  #
  # A fresh "pre-deploy" backup runs first, before touching anything — the nightly cron backup
  # could be up to ~24h stale by the time a migration actually runs.
  deploy:
    runs-on: ubuntu-latest
    needs: [ scan_ruby, test, frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            bash scripts/backup.sh pre-deploy

            git fetch origin
            git checkout main
            git pull origin main

            docker compose -f docker-compose.prod.yml --env-file .env.prod build

            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm web bin/rails db:migrate

            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
